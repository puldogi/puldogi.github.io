<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웰니스 채용공고 생성기 (이미지 방식)</title>
<style>
  :root{--teal:#1C9D9F;--teal-deep:#287C82;--teal-ink:#155A63;--mint:#EAF6F7;
    --line:#DCE6E8;--ink:#26343A;--muted:#7A8C93;--bg:#F4F7F8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic",sans-serif;font-size:14px;line-height:1.6}
  .eyebrow{font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--teal);text-transform:uppercase}
  header{background:#fff;border-bottom:1px solid var(--line);padding:22px 26px}
  header h1{margin:6px 0 4px;font-size:20px;letter-spacing:-.02em}
  header p{margin:0;color:var(--muted);font-size:13px}
  .wrap{display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:22px;padding:22px 26px 70px;align-items:start}
  @media (max-width:960px){.wrap{grid-template-columns:1fr}}
  .sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .num{font-size:12px;font-weight:800;color:var(--teal);letter-spacing:.08em}
  .sec h2{margin:0;font-size:15px}
  .sec .desc{margin:0 0 14px;font-size:12.5px;color:var(--muted)}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}
  textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;
    font-size:12.5px;color:var(--ink);background:#fff;font-family:ui-monospace,Menlo,Consolas,monospace}
  textarea{min-height:260px;resize:vertical;line-height:1.8}
  #out{min-height:200px;background:#FAFCFC;font-size:11px;line-height:1.5}
  button{border:0;border-radius:7px;padding:10px 15px;font-size:13px;font-weight:600;
    background:var(--teal-deep);color:#fff;cursor:pointer;font-family:inherit}
  button:hover{background:var(--teal-ink)}
  button.ghost{background:#fff;color:var(--teal-ink);border:1px solid var(--line)}
  button.ghost:hover{background:var(--mint)}
  button:focus-visible{outline:2px solid var(--teal-ink);outline-offset:2px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .hint{font-size:12px;color:var(--muted);margin:7px 0 0}
  .hint code{background:var(--mint);padding:1px 5px;border-radius:3px;font-size:11.5px}
  .status{font-size:12px;color:var(--teal-deep);min-height:16px}
  .err{color:#C0392B;font-size:12px;margin-top:8px;white-space:pre-line}
  .stage{background:#E6EDEF;border-radius:10px;padding:16px;overflow:auto;max-height:620px}
  .stage-inner{margin:0 auto;background:#fff;width:700px}
  .imgst{font-size:11.5px;margin-top:5px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px}
  .cellst{font-size:10.5px;text-align:center;padding:6px 2px;border-radius:4px;background:#F0F4F5;color:var(--muted)}
  .cellst.ok{background:#E7F4F0;color:#1F7A5A}
  .cellst.no{background:#FBEBE9;color:#C0392B}
</style>
</head>
<body>

<header>
  <div class="eyebrow">WELL &amp; MEDI · 채용 운영 도구</div>
  <h1>웰니스 채용공고 생성기 (이미지 방식)</h1>
  <p>지점별 링크만 채우면 게시용 HTML이 나옵니다. 코드에 width가 없어 어느 채용사이트에서도 폭이 틀어지지 않습니다.</p>
</header>

<div class="wrap">
  <div>
    <section class="sec">
      <div class="sec-head"><span class="num">01</span><h2>지점별 링크</h2></div>
      <p class="desc">이미지에 그려진 순서라 지점명은 고정입니다. 오른쪽 링크만 채우세요. 비우면 링크 없이 그림만 들어갑니다.</p>
      <textarea id="links" spellcheck="false"></textarea>
      <div class="grid" id="cells"></div>
      <div class="bar"><button class="ghost" id="fillMedijob">메디잡 검색 링크로 채우기</button></div>
      <p class="hint">지점명은 바꾸지 마세요. 이미지 조각과 짝이 맞아야 합니다.</p>
    </section>

    <section class="sec">
      <div class="sec-head"><span class="num">02</span><h2>작업 보관</h2></div>
      <div class="bar">
        <button class="ghost" id="save">현재 작업 저장</button>
        <button class="ghost" id="loadBtn">저장 작업 불러오기</button>
        <input type="file" id="loadFile" accept=".json" hidden>
      </div>
    </section>
  </div>

  <div>
    <section class="sec">
      <div class="eyebrow">Live preview</div>
      <div class="sec-head" style="margin-top:6px"><h2>미리보기</h2></div>
      <p class="desc">실제 700px 폭 그대로입니다.</p>
      <div class="stage"><div class="stage-inner" id="preview"></div></div>
    </section>

    <section class="sec">
      <div class="eyebrow">Publish</div>
      <div class="sec-head" style="margin-top:6px"><h2>게시용 HTML</h2></div>
      <textarea id="out" spellcheck="false" readonly></textarea>
      <div class="bar">
        <button id="copy">HTML 복사</button>
        <button class="ghost" id="download">HTML 파일 저장</button>
        <span class="status" id="status"></span>
      </div>
      <div class="err" id="err"></div>
    </section>
  </div>
</div>

<script>
// 메인이미지에 그려진 순서 — 바꾸면 조각과 어긋납니다
const GRID=[["송도","하남","광명","강남"],
            ["광주","수원","둔촌","의정부"],
            ["안양","동탄","마포","청량리"]];
const NAMES=GRID.flat().filter(Boolean);
const BASE="https://puldogi.github.io/images";
const MEDIJOB="https://www.medijob.cc/com/sch/com_sch_100?searchText=";

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function parseLinks(){
  const map={},errs=[];
  $("links").value.split(/\r?\n/).forEach((line,i)=>{
    const t=line.trim(); if(!t) return;
    const c=t.split(/\t|\s*\|\s*/).map(x=>x.trim());
    const name=c[0].replace(/웰니스.*$/,"");
    if(!NAMES.includes(name)){ errs.push((i+1)+"행: 모르는 지점명 → "+c[0]); return; }
    let url=c[1]||"";
    if(url&&!/^https?:\/\//i.test(url)) url="https://"+url;
    map[name]=url;
  });
  return {map,errs};
}

function build(base,map,local){
  const p=local?"":(base?base.replace(/\/+$/,"")+"/":"");
  const pad='style="padding:0;font-size:0;line-height:0;"';
  let h='<table border="0" cellpadding="0" cellspacing="0" align="center" style="border-collapse:collapse;margin:0 auto;">\n<tbody>\n';
  h+='<tr><td colspan="4" '+pad+'><img src="'+esc(p+"top.png")+'" border="0" alt="웰니스건강검진센터 채용공고" style="display:block;border:0;"></td></tr>\n';
  GRID.forEach((row,r)=>{
    h+='<tr>\n';
    row.forEach((name,c)=>{
      const file=p+"btn_r"+(r+1)+"c"+(c+1)+".png";
      let img='<img src="'+esc(file)+'" border="0" alt="'+(name?esc(name)+'웰니스 채용 바로가기':'')+'" style="display:block;border:0;">';
      const url=name?map[name]:"";
      if(url) img='<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer" style="display:block;text-decoration:none;">'+img+'</a>';
      h+='  <td '+pad+'>'+img+'</td>\n';
    });
    h+='</tr>\n';
  });
  h+='<tr><td colspan="4" '+pad+'><img src="'+esc(p+"bottom.png")+'" border="0" alt="지원 방법 및 채용 절차" style="display:block;border:0;"></td></tr>\n';
  h+='</tbody>\n</table>';
  return h;
}

function render(){
  const {map,errs}=parseLinks();
  $("err").textContent=errs.join("\n");
  $("cells").innerHTML=GRID.flat().map(n=>{
    if(!n) return '<div class="cellst">·</div>';
    const ok=!!map[n];
    return '<div class="cellst '+(ok?"ok":"no")+'">'+n+(ok?" ✓":" 링크없음")+'</div>';
  }).join("");
  const html=build(BASE,map,false);
  $("out").value=html;
  $("preview").innerHTML=html;
}

let t;
$("links").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(render,300);});

$("fillMedijob").addEventListener("click",()=>{
  $("links").value=NAMES.map(n=>n+" | "+MEDIJOB+encodeURIComponent(n+"웰니스")).join("\n");
  render();
});

$("save").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify({links:$("links").value},null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="wellness-recruit-image-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
  $("status").textContent="저장했습니다."; setTimeout(()=>$("status").textContent="",2000);
});
$("loadBtn").addEventListener("click",()=>$("loadFile").click());
$("loadFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result);
    if(s.links!==undefined)$("links").value=s.links;
    render(); $("status").textContent="불러왔습니다.";
  }catch(err){ $("status").textContent="파일을 읽지 못했습니다."; }
  setTimeout(()=>$("status").textContent="",2500); };
  r.readAsText(f); e.target.value="";
});

$("copy").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText($("out").value); }
  catch(e){ $("out").removeAttribute("readonly"); $("out").select();
    document.execCommand("copy"); $("out").setAttribute("readonly",""); }
  $("status").textContent="복사했습니다."; setTimeout(()=>$("status").textContent="",2000);
});
$("download").addEventListener("click",()=>{
  const doc='<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>웰니스 채용공고</title></head>'
    +'<body style="margin:0;padding:20px 0;background:#fff;">\n'+$("out").value+'\n</body></html>';
  const blob=new Blob([doc],{type:"text/html;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="wellness-recruit.html"; a.click();
  URL.revokeObjectURL(a.href);
  $("status").textContent="저장했습니다."; setTimeout(()=>$("status").textContent="",2000);
});

$("links").value=NAMES.map(n=>n+" | ").join("\n");
render();
</script>
</body>
</html>
